name: インスタへ出す
on:
  schedule:
    - cron: "0 9 * * *"     # 日本時間18時
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dasu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 今日のぶんを出す
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 dasu.py
      - name: 予約表を書き戻す
        run: |
          git config user.name "shibasun-bot"
          git config user.email "bot@shibasun.jp"
          git add yotei.json
          git diff --cached --quiet || git commit -m "出した記録"
          git push
